<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BryAi Offer Form</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4efe7;
      font-family: Georgia, serif;
    }

    .offer-card {
      width: min(560px, 88vw);
      padding: 34px 30px;
      border: 2px solid #2b2118;
      border-radius: 24px;
      background: #fffaf1;
      box-shadow: 0 18px 40px rgba(0,0,0,.16);
    }

    .title {
      margin: 0 0 12px;
      font-size: 42px;
      letter-spacing: .03em;
      text-align: center;
      color: #21170f;
    }

    .subtext {
      margin: 0 auto 26px;
      max-width: 430px;
      font-size: 20px;
      line-height: 1.45;
      text-align: center;
      color: #4b3929;
    }

    .option-list {
      display: grid;
      gap: 14px;
    }

    .option {
      padding: 16px 18px;
      border: 1.5px solid #2b2118;
      border-radius: 16px;
      background: #f8ecd9;
      color: #23170f;
      box-shadow: 0 6px 0 #2b2118;
    }

    .option-title {
      display: block;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: .02em;
    }

    .option-desc {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      color: #5a4635;
    }
  </style>
</head>

<body>
  <div class="offer-card">
    <h1 class="title">Offer Form</h1>

    <p class="subtext">
      Select what you need help with from BryAi:
    </p>

    <div class="option-list">
      <div class="option">
        <span class="option-title">Art</span>
        <span class="option-desc">creative design</span>
      </div>

      <div class="option">
        <span class="option-title">Code</span>
        <span class="option-desc">computer systems</span>
      </div>

      <div class="option">
        <span class="option-title">Not sure</span>
        <span class="option-desc">that’s ok</span>
      </div>

      <div class="option">
        <span class="option-title">A solution</span>
        <span class="option-desc">finding a way</span>
      </div>
    </div>
  </div>
</body>
</html>
