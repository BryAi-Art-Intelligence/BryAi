<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BryAi Mono Block</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0d12;
  }

  .bryai-wrap {
    text-align: center;
  }

  .bryai {
    font-family: "Courier New", monospace;
    font-size: clamp(64px, 17vw, 190px);
    font-weight: 800;
    line-height: 0.85;
    color: white;
  }

  .subtitle {
    margin-top: 0.75em;
    font-family: "Courier New", monospace;
    font-size: clamp(18px, 4vw, 42px);
    font-weight: 800;
    font-style: italic;
    line-height: 1;
    color: rgba(255, 255, 255, 0.72);
    text-align: center;
  }

  .number-lines {
    margin-top: 1.4em;
    display: inline-grid;
    gap: 0.45em;
    text-align: left;
    font-family: "Courier New", monospace;
    font-size: clamp(18px, 4vw, 40px);
    font-weight: 800;
    line-height: 1;
    color: rgba(255, 255, 255, 0.72);
  }
</style>
</head>
<body>

  <div class="bryai-wrap">
    <div class="bryai">BryAi</div>
    <div class="subtitle">Art Intelligence</div>
    <div class="number-lines">
      <div>1:</div>
      <div>2:</div>
      <div>3:</div>
    </div>
  </div>

</body>
</html>
