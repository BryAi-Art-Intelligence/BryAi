<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BryAi Mono Block</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0d12;
  }

  .bryai-wrap {
    text-align: center;
  }

  .bryai {
    font-family: "Courier New", monospace;
    font-size: clamp(64px, 17vw, 190px);
    font-weight: 800;
    line-height: 0.85;
    color: white;
  }

  .subtitle {
    margin-top: 0.75em;
    font-family: "Courier New", monospace;
    font-size: clamp(18px, 4vw, 42px);
    font-weight: 800;
    font-style: italic;
    line-height: 1;
    color: rgba(255, 255, 255, 0.72);
    text-align: center;
  }

  .number-lines {
    margin-top: 1.4em;
    display: inline-grid;
    gap: 0.45em;
    text-align: left;
    font-family: "Courier New", monospace;
    font-size: clamp(16px, 3.5vw, 34px);
    font-weight: 800;
    line-height: 1.08;
    color: rgba(255, 255, 255, 0.72);
  }

  .bryai-input {
    margin-top: 0.7em;
    width: min(72vw, 520px);
    box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 0;
    background: transparent;
    padding: 0.55em 0.65em;
    font-family: "Courier New", monospace;
    font-size: clamp(16px, 3.5vw, 32px);
    font-weight: 800;
    color: white;
    outline: none;
  }

  .bryai-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }
</style>
</head>
<body>

  <div class="bryai-wrap">
    <div class="bryai">BryAi</div>
    <div class="subtitle">Art Intelligence</div>
    <div class="number-lines">
      <div>1: Type what’s on your mind</div>
      <div>2: Send it to BryAi</div>
      <div>3: Return through the custom link</div>
      <input class="bryai-input" type="text">
    </div>
  </div>

</body>
</html>
