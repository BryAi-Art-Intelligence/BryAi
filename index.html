<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BryAi Questions</title>
  <style>
    :root { background: #0b0d12; }
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-width: 100%;
      min-height: 100%;
      background: #0b0d12;
      overflow: hidden;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      background: #f7f5f0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    .viewport::-webkit-scrollbar { display: none; }

    .artwork {
      display: block;
      height: 80vh;
      height: 80svh;
      width: auto;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <main class="viewport" aria-label="Scrollable BryAi question artwork">
    <img class="artwork" src="67B6C065-A3CF-4CC7-BF69-381820011A81.png" alt="BryAi questions">
  </main>
</body>
</html>
