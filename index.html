<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BryAi Mono Block</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0d12;
    overflow: hidden;
  }

  .bryai-wrap {
    text-align: center;
  }

  .bryai {
    font-family: "Courier New", monospace;
    font-size: clamp(64px, 17vw, 190px);
    font-weight: 800;
    line-height: 0.85;
    color: white;
  }

  .subtitle {
    margin-top: 0.75em;
    font-family: "Courier New", monospace;
    font-size: clamp(18px, 4vw, 42px);
    font-weight: 800;
    font-style: italic;
    line-height: 1;
    color: rgba(255, 255, 255, 0.72);
    text-align: center;
  }

  .number-lines {
    margin-top: 1.4em;
    display: inline-grid;
    gap: 0.45em;
    text-align: left;
    font-family: "Courier New", monospace;
    font-size: clamp(16px, 3.5vw, 34px);
    font-weight: 800;
    line-height: 1.08;
    color: rgba(255, 255, 255, 0.72);
  }

  .input-stage {
    position: relative;
    margin-top: 0.7em;
    width: min(72vw, 520px);
    transform-origin: center;
    overflow: visible;
  }

  .input-stage::before,
  .input-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    opacity: 0;
    pointer-events: none;
  }

  .input-stage::before {
    border: 2px solid rgba(255, 255, 255, 0.88);
    background:
      linear-gradient(32deg, transparent 49.3%, rgba(255, 255, 255, 0.82) 50%, transparent 50.7%),
      linear-gradient(148deg, transparent 49.3%, rgba(255, 255, 255, 0.82) 50%, transparent 50.7%),
      rgba(11, 13, 18, 0.96);
  }

  .input-stage::after {
    inset: 2px 2px auto 2px;
    height: 58%;
    background:
      linear-gradient(153deg, transparent 49%, rgba(255, 255, 255, 0.82) 50%, transparent 51%),
      linear-gradient(207deg, transparent 49%, rgba(255, 255, 255, 0.82) 50%, transparent 51%),
      rgba(11, 13, 18, 0.98);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
  }

  .bryai-input,
  .bryai-measure {
    width: 100%;
    min-height: 2.55em;
    max-height: 7.2em;
    box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 0;
    background: transparent;
    padding: 0.55em 0.65em;
    font-family: "Courier New", monospace;
    font-size: clamp(16px, 3.5vw, 32px);
    font-weight: 800;
    line-height: 1.25;
    color: white;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .bryai-input {
    display: block;
    outline: none;
    resize: none;
    overflow-y: hidden;
    transition: color 260ms ease, border-color 260ms ease, background 260ms ease;
  }

  .bryai-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }

  .bryai-measure {
    position: absolute;
    left: 0;
    top: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .send-dot {
    position: absolute;
    left: 0;
    top: 0;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    background: #0b0d12;
    color: white;
    font-family: "Courier New", monospace;
    font-size: clamp(13px, 2.8vw, 22px);
    font-weight: 800;
    line-height: 1;
    padding: 0.38em 0.74em;
    cursor: pointer;
    opacity: 0;
    transform: translate(0.35em, -50%) scale(0.92);
    pointer-events: none;
    transition: opacity 420ms ease, transform 420ms ease, border-color 420ms ease;
  }

  .send-dot.is-visible {
    opacity: 1;
    transform: translate(0.55em, -50%) scale(1);
    pointer-events: auto;
  }

  .send-dot:hover,
  .send-dot:focus-visible {
    border-color: white;
  }

  .mailbox {
    position: fixed;
    right: min(8vw, 78px);
    top: min(22vh, 185px);
    width: clamp(74px, 15vw, 132px);
    height: clamp(58px, 11vw, 96px);
    opacity: 0;
    pointer-events: none;
    transform: translateY(16px) scale(0.86);
    transform-origin: bottom center;
    z-index: 4;
  }

  .mailbox::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18%;
    height: 66%;
    border: 2px solid rgba(255, 255, 255, 0.82);
    border-radius: 999px 999px 10px 10px;
    background:
      linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent 45%),
      rgba(11, 13, 18, 0.96);
  }

  .mailbox::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 2px;
    height: 24%;
    background: rgba(255, 255, 255, 0.72);
    transform: translateX(-50%);
  }

  .mailbox-slot {
    position: absolute;
    left: 18%;
    top: 47%;
    width: 48%;
    height: 2px;
    background: rgba(255, 255, 255, 0.86);
    transform-origin: left center;
  }

  .mailbox-flag {
    position: absolute;
    right: 6%;
    top: 18%;
    width: 24%;
    height: 18%;
    border: 2px solid rgba(255, 255, 255, 0.78);
    border-left: 0;
    transform-origin: left bottom;
  }

  .mailbox.is-open {
    animation: mailbox-appear 1700ms ease forwards;
  }

  .mailbox.is-open .mailbox-slot {
    animation: mailbox-glow 1700ms ease forwards;
  }

  .mailbox.is-open .mailbox-flag {
    animation: mailbox-flag 1700ms ease forwards;
  }

  .input-stage.is-delivering {
    animation: note-away 1450ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    z-index: 10;
  }

  .input-stage.is-delivering::before {
    animation: note-body 1450ms ease forwards;
  }

  .input-stage.is-delivering::after {
    animation: note-flap 1450ms ease forwards;
  }

  .input-stage.is-delivering .bryai-input {
    color: transparent;
    border-color: rgba(255, 255, 255, 0);
    background: rgba(255, 255, 255, 0.035);
  }

  .input-stage.is-delivering .send-dot {
    opacity: 0;
    transform: translate(0.55em, -50%) scale(0.72);
    pointer-events: none;
  }

  @keyframes mailbox-appear {
    0% { opacity: 0; transform: translateY(16px) scale(0.86); }
    16%, 78% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(8px) scale(0.92); }
  }

  @keyframes mailbox-glow {
    0%, 48% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
    62% { box-shadow: 0 0 18px rgba(255, 255, 255, 0.46); }
    100% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
  }

  @keyframes mailbox-flag {
    0%, 48% { transform: rotate(0deg); }
    62% { transform: rotate(-42deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes note-body {
    0% { opacity: 0; transform: scale(1, 1); }
    18%, 100% { opacity: 1; }
    42% { transform: scale(1, 0.72); }
    100% { transform: scale(0.38, 0.22); }
  }

  @keyframes note-flap {
    0% { opacity: 0; transform: rotateX(0deg) scaleY(1); }
    18% { opacity: 1; transform: rotateX(0deg) scaleY(1); }
    42%, 100% { opacity: 1; transform: rotateX(180deg) scaleY(0.95); }
  }

  @keyframes note-away {
    0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    42% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    78% { transform: translate(56vw, -34vh) rotate(10deg) scale(0.34); opacity: 1; }
    100% { transform: translate(60vw, -36vh) rotate(10deg) scale(0.08); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="bryai-wrap">
    <div class="bryai">BryAi</div>
    <div class="subtitle">Art Intelligence</div>
    <div class="number-lines">
      <div>1: Type what’s on your mind</div>
      <div>2: Send it to BryAi and wait</div>
      <div>3: Return through custom link</div>
      <div class="input-stage">
        <textarea class="bryai-input" rows="1"></textarea>
        <div class="bryai-measure" aria-hidden="true"></div>
        <button class="send-dot" type="button">SEND</button>
      </div>
    </div>
  </div>

  <div class="mailbox" aria-hidden="true">
    <div class="mailbox-slot"></div>
    <div class="mailbox-flag"></div>
  </div>

<script>
  const inputStage = document.querySelector('.input-stage');
  const bryaiInput = document.querySelector('.bryai-input');
  const bryaiMeasure = document.querySelector('.bryai-measure');
  const sendDot = document.querySelector('.send-dot');
  const mailbox = document.querySelector('.mailbox');
  let idleTimer;

  function escapeText(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n$/g, '\n ')
      .replace(/\n/g, '<br>');
  }

  function growBryAiInput() {
    bryaiInput.style.height = 'auto';
    bryaiInput.style.height = bryaiInput.scrollHeight + 'px';
    bryaiMeasure.style.height = bryaiInput.style.height;
  }

  function placeSendDot() {
    const text = bryaiInput.value;

    if (!text.trim() || inputStage.classList.contains('is-delivering')) {
      sendDot.classList.remove('is-visible');
      return;
    }

    bryaiMeasure.innerHTML = escapeText(text) + '<span class="end-mark">&#8203;</span>';
    const endMark = bryaiMeasure.querySelector('.end-mark');
    const stageBox = inputStage.getBoundingClientRect();
    const markBox = endMark.getBoundingClientRect();

    sendDot.style.left = markBox.left - stageBox.left + 'px';
    sendDot.style.top = markBox.top - stageBox.top + markBox.height / 2 + 'px';
    sendDot.classList.add('is-visible');
  }

  function hideThenWait() {
    sendDot.classList.remove('is-visible');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(placeSendDot, 700);
  }

  function deliverNote() {
    if (!bryaiInput.value.trim() || inputStage.classList.contains('is-delivering')) return;

    clearTimeout(idleTimer);
    sendDot.classList.remove('is-visible');
    bryaiInput.blur();
    mailbox.classList.remove('is-open');
    void mailbox.offsetWidth;
    mailbox.classList.add('is-open');
    inputStage.classList.add('is-delivering');

    setTimeout(() => {
      bryaiInput.value = '';
      inputStage.classList.remove('is-delivering');
      mailbox.classList.remove('is-open');
      growBryAiInput();
    }, 1700);
  }

  bryaiInput.addEventListener('input', () => {
    growBryAiInput();
    hideThenWait();
  });

  sendDot.addEventListener('click', deliverNote);

  window.addEventListener('resize', () => {
    growBryAiInput();
    placeSendDot();
  });

  growBryAiInput();
</script>
</body>
</html>
