<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BryAi Mono Block</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0d12;
  }

  .bryai-wrap {
    text-align: center;
  }

  .bryai {
    font-family: "Courier New", monospace;
    font-size: clamp(64px, 17vw, 190px);
    font-weight: 800;
    line-height: 0.85;
    color: white;
  }

  .subtitle {
    margin-top: 0.75em;
    font-family: "Courier New", monospace;
    font-size: clamp(18px, 4vw, 42px);
    font-weight: 800;
    font-style: italic;
    line-height: 1;
    color: rgba(255, 255, 255, 0.72);
    text-align: center;
  }

  .number-lines {
    margin-top: 1.4em;
    display: inline-grid;
    gap: 0.45em;
    text-align: left;
    font-family: "Courier New", monospace;
    font-size: clamp(16px, 3.5vw, 34px);
    font-weight: 800;
    line-height: 1.08;
    color: rgba(255, 255, 255, 0.72);
  }

  .input-stage {
    position: relative;
    margin-top: 0.7em;
    width: min(72vw, 520px);
  }

  .bryai-input,
  .bryai-measure {
    width: 100%;
    min-height: 2.55em;
    max-height: 7.2em;
    box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 0;
    background: transparent;
    padding: 0.55em 0.65em;
    font-family: "Courier New", monospace;
    font-size: clamp(16px, 3.5vw, 32px);
    font-weight: 800;
    line-height: 1.25;
    color: white;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .bryai-input {
    display: block;
    outline: none;
    resize: none;
    overflow-y: hidden;
  }

  .bryai-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }

  .bryai-measure {
    position: absolute;
    left: 0;
    top: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .send-dot {
    position: absolute;
    left: 0;
    top: 0;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    background: #0b0d12;
    color: white;
    font-family: "Courier New", monospace;
    font-size: clamp(13px, 2.8vw, 22px);
    font-weight: 800;
    line-height: 1;
    padding: 0.38em 0.74em;
    cursor: pointer;
    opacity: 0;
    transform: translate(0.35em, -50%) scale(0.92);
    pointer-events: none;
    transition:
      opacity 420ms ease,
      transform 420ms ease,
      border-color 420ms ease;
  }

  .send-dot.is-visible {
    opacity: 1;
    transform: translate(0.55em, -50%) scale(1);
    pointer-events: auto;
  }

  .send-dot:hover,
  .send-dot:focus-visible {
    border-color: white;
  }
</style>
</head>
<body>

  <div class="bryai-wrap">
    <div class="bryai">BryAi</div>
    <div class="subtitle">Art Intelligence</div>
    <div class="number-lines">
      <div>1: Type what’s on your mind</div>
      <div>2: Send it to BryAi and wait</div>
      <div>3: Return through custom link</div>
      <div class="input-stage">
        <textarea class="bryai-input" rows="1"></textarea>
        <div class="bryai-measure" aria-hidden="true"></div>
        <button class="send-dot" type="button">SEND</button>
      </div>
    </div>
  </div>

<script>
  const bryaiInput = document.querySelector('.bryai-input');
  const bryaiMeasure = document.querySelector('.bryai-measure');
  const sendDot = document.querySelector('.send-dot');
  let idleTimer;

  function escapeText(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n$/g, '\n ')
      .replace(/\n/g, '<br>');
  }

  function growBryAiInput() {
    bryaiInput.style.height = 'auto';
    bryaiInput.style.height = bryaiInput.scrollHeight + 'px';
    bryaiMeasure.style.height = bryaiInput.style.height;
  }

  function placeSendDot() {
    const text = bryaiInput.value;

    if (!text.trim()) {
      sendDot.classList.remove('is-visible');
      return;
    }

    bryaiMeasure.innerHTML = escapeText(text) + '<span class="end-mark">&#8203;</span>';
    const endMark = bryaiMeasure.querySelector('.end-mark');
    const stageBox = document.querySelector('.input-stage').getBoundingClientRect();
    const markBox = endMark.getBoundingClientRect();

    sendDot.style.left = markBox.left - stageBox.left + 'px';
    sendDot.style.top = markBox.top - stageBox.top + markBox.height / 2 + 'px';
    sendDot.classList.add('is-visible');
  }

  function hideThenWait() {
    sendDot.classList.remove('is-visible');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(placeSendDot, 700);
  }

  bryaiInput.addEventListener('input', () => {
    growBryAiInput();
    hideThenWait();
  });

  window.addEventListener('resize', () => {
    growBryAiInput();
    placeSendDot();
  });

  growBryAiInput();
</script>
</body>
</html>
