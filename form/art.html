<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BryAi Art Form</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4efe7;font-family:Georgia,serif;color:#21170f}.form-card{width:min(620px,92vw);padding:34px 30px;border:2px solid #2b2118;border-radius:24px;background:#fffaf1;box-shadow:0 18px 40px rgba(0,0,0,.16);animation:rise .45s ease both}.back{display:inline-block;margin-bottom:18px;color:#5a4635;text-decoration:none;font-size:15px}.title{margin:0 0 8px;font-size:42px;letter-spacing:.03em;text-align:center}.subtext{margin:0 auto 26px;max-width:460px;font-size:19px;line-height:1.45;text-align:center;color:#4b3929}.lines{display:grid;gap:14px}.line{display:grid;gap:6px}.line label{font-size:17px;color:#3b2b1f}.line input,.line textarea{width:100%;border:1.5px solid #2b2118;border-radius:14px;background:#f8ecd9;color:#23170f;padding:13px 14px;font:18px Georgia,serif;box-shadow:0 5px 0 #2b2118}.line textarea{min-height:74px;resize:vertical}.send{margin-top:18px;width:100%;border:1.5px solid #2b2118;border-radius:16px;background:#23170f;color:#fffaf1;padding:15px 18px;font:bold 18px Georgia,serif;letter-spacing:.05em;box-shadow:0 6px 0 #8b6b4a}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<form class="form-card" action="mailto:bundleddomains@gmail.com" method="post" enctype="text/plain">
<a class="back" href="../form.html">← offer form</a>
<h1 class="title">Art</h1>
<p class="subtext">Tell BryAi what kind of creative design you need.</p>
<div class="lines">
<div class="line"><label for="one">1. What do you want made?</label><input id="one" name="1_art_goal" autocomplete="off"></div>
<div class="line"><label for="two">2. What should it feel like?</label><input id="two" name="2_feeling" autocomplete="off"></div>
<div class="line"><label for="three">3. Any colors, words, or symbols?</label><input id="three" name="3_details" autocomplete="off"></div>
<div class="line"><label for="four">4. Where will you use it?</label><input id="four" name="4_use" autocomplete="off"></div>
<div class="line"><label for="five">5. Extra notes</label><textarea id="five" name="5_notes"></textarea></div>
</div>
<button class="send" type="submit">Send Art Offer</button>
</form>
</body>
</html>
