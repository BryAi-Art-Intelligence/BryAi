<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Vault Door</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 25%, rgba(190,220,255,.08), transparent 34%),
    linear-gradient(180deg, #11141a 0%, #080a0e 100%);
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  overflow: hidden;
}

.stage {
  width: min(94vw, 780px);
  display: grid;
  justify-items: center;
  gap: 18px;
}

.scene {
  position: relative;
  width: min(92vw, 620px);
  aspect-ratio: 1 / .82;
  display: grid;
  place-items: center;
  perspective: 1100px;
}

.wall {
  position: absolute;
  inset: 6%;
  border-radius: 34px;
  background:
    linear-gradient(145deg, #3d424b 0%, #242932 42%, #171a21 100%);
  box-shadow:
    inset 0 0 0 8px rgba(255,255,255,.035),
    inset 0 0 80px rgba(0,0,0,.42),
    0 32px 80px rgba(0,0,0,.55);
}

.safe-glow {
  position: absolute;
  width: 42%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255,228,164,.95), rgba(255,174,82,.25) 45%, transparent 72%);
  filter: blur(7px);
  opacity: 0;
  transform: scale(.65);
  transition: opacity 1.1s ease .9s, transform 1.1s ease .9s;
}

.memory-cards {
  position: absolute;
  width: 42%;
  height: 42%;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(.82);
  transition: opacity 1s ease 1.15s, transform 1s ease 1.15s;
}

.card {
  position: absolute;
  width: 36%;
  height: 24%;
  border-radius: 12px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.95), rgba(233,224,205,.92));
  box-shadow: 0 10px 24px rgba(0,0,0,.28);
  color: rgba(40,32,22,.78);
  display: grid;
  place-items: center;
  font-size: clamp(9px, 1.9vw, 13px);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.c1 { transform: translate(-64%, -42%) rotate(-10deg); }
.c2 { transform: translate(38%, -48%) rotate(8deg); }
.c3 { transform: translate(-46%, 44%) rotate(7deg); }
.c4 { transform: translate(58%, 36%) rotate(-8deg); }
.c5 { transform: translate(0%, -2%) rotate(1deg); }

.door-wrap {
  position: relative;
  width: 72%;
  aspect-ratio: 1.28 / 1;
  transform-style: preserve-3d;
  transform-origin: 18% 50%;
  transition:
    transform 1.55s cubic-bezier(.16,.72,.18,1) .95s,
    filter .7s ease;
}

.door {
  position: absolute;
  inset: 0;
  border-radius: 34px;
  background:
    radial-gradient(circle at 42% 33%, rgba(255,255,255,.055), transparent 28%),
    linear-gradient(145deg, #3a3f48 0%, #242932 50%, #171a20 100%);
  box-shadow:
    inset 0 0 0 8px rgba(255,255,255,.045),
    inset 0 0 60px rgba(0,0,0,.35),
    0 22px 42px rgba(0,0,0,.48);
  transition:
    transform .75s cubic-bezier(.2,.8,.2,1) .55s,
    box-shadow .75s ease .55s;
}

.vault {
  position: absolute;
  left: 17%;
  top: 50%;
  width: 52%;
  aspect-ratio: 1 / 1;
  transform: translateY(-50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 28%, #dce4ec 0%, #a4afba 17%, #75808d 38%, #525b66 62%, #303741 100%);
  box-shadow:
    inset 0 0 0 10px #c3cbd4,
    inset 0 0 0 24px #707b87,
    inset 0 0 0 35px #2a3038,
    0 18px 38px rgba(0,0,0,.48);
}

.vault::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,.35), transparent 30%),
    radial-gradient(circle, #929ca8 0%, #6e7985 48%, #444c56 76%, #252b33 100%);
  box-shadow:
    inset 0 0 0 6px rgba(255,255,255,.14),
    inset 0 0 22px rgba(0,0,0,.32);
}

.inner-ring {
  position: absolute;
  inset: 24%;
  border-radius: 50%;
  border: 8px solid rgba(222,230,238,.42);
  z-index: 2;
}

.wheel {
  position: absolute;
  inset: 0;
  z-index: 4;
  transition: transform 1s cubic-bezier(.18,.82,.16,1);
}

.spoke {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4.4%;
  height: 31%;
  transform-origin: 50% 100%;
  border-radius: 999px;
  background:
    linear-gradient(90deg, #48515d 0%, #aeb8c4 23%, #eef3f8 50%, #98a3af 77%, #3d4650 100%);
  box-shadow:
    inset 0 0 5px rgba(255,255,255,.24),
    inset 0 0 7px rgba(0,0,0,.26),
    0 4px 10px rgba(0,0,0,.25);
}

.s1 { transform: translate(-50%, -100%) rotate(0deg); }
.s2 { transform: translate(-50%, -100%) rotate(60deg); }
.s3 { transform: translate(-50%, -100%) rotate(120deg); }
.s4 { transform: translate(-50%, -100%) rotate(180deg); }
.s5 { transform: translate(-50%, -100%) rotate(240deg); }
.s6 { transform: translate(-50%, -100%) rotate(300deg); }

.hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 17%;
  aspect-ratio: 1 / 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #f4f7fb 0%, #aeb8c3 25%, #6f7a86 58%, #3b434c 100%);
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.22),
    inset 0 0 12px rgba(0,0,0,.35),
    0 7px 18px rgba(0,0,0,.4);
}

.hub::before {
  content: "";
  position: absolute;
  inset: 16%;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.22);
  box-shadow: inset 0 0 10px rgba(0,0,0,.18);
}

.hub::after {
  content: "";
  position: absolute;
  inset: 34%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #d9e1e8, #697480);
  box-shadow: inset 0 0 7px rgba(0,0,0,.42);
}

.bolt {
  position: absolute;
  right: 8%;
  width: 9%;
  height: 17%;
  border-radius: 999px;
  background:
    linear-gradient(90deg, #323943 0%, #8d98a4 26%, #edf2f7 52%, #9ba6b2 77%, #343b45 100%);
  box-shadow:
    inset 0 0 5px rgba(255,255,255,.22),
    0 8px 16px rgba(0,0,0,.4);
  transition: transform .55s cubic-bezier(.2,.8,.2,1) .35s;
}

.bolt.top { top: 26%; }
.bolt.bottom { top: 56%; }

.label {
  position: absolute;
  left: 34%;
  bottom: 8%;
  transform: translateX(-50%);
  padding: 11px 22px;
  border-radius: 999px;
  letter-spacing: .22em;
  font-size: clamp(10px, 2vw, 14px);
  color: rgba(255,255,255,.88);
  background: rgba(0,0,0,.24);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 8px 18px rgba(0,0,0,.25);
  text-transform: uppercase;
  white-space: nowrap;
}

.status {
  min-height: 24px;
  text-align: center;
  color: rgba(255,255,255,.72);
  letter-spacing: .08em;
  font-size: 12px;
  text-transform: uppercase;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 15px 26px;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: #12161b;
  background:
    linear-gradient(180deg, #e9ffe2, #9cf58d);
  box-shadow:
    0 0 22px rgba(166,255,139,.38),
    0 12px 28px rgba(0,0,0,.38),
    inset 0 0 0 2px rgba(255,255,255,.45);
  cursor: pointer;
}

button:active {
  transform: translateY(1px);
}

/* OPEN STATE */

.scene.open .wheel {
  transform: rotate(405deg);
}

.scene.open .bolt {
  transform: translateX(-46%);
}

.scene.open .door {
  transform: translateZ(74px) scale(1.035);
  box-shadow:
    inset 0 0 0 8px rgba(255,255,255,.05),
    inset 0 0 60px rgba(0,0,0,.34),
    0 28px 58px rgba(0,0,0,.6);
}

.scene.open .door-wrap {
  transform: rotateY(-58deg) translateX(-3%) translateZ(16px);
  filter: drop-shadow(30px 28px 30px rgba(0,0,0,.45));
}

.scene.open .safe-glow {
  opacity: 1;
  transform: scale(1);
}

.scene.open .memory-cards {
  opacity: 1;
  transform: scale(1);
}

@media (max-width: 520px) {
  .scene {
    width: 96vw;
  }

  .door-wrap {
    width: 78%;
  }

  .label {
    left: 35%;
    font-size: 10px;
    padding: 9px 15px;
  }
}
</style>
</head>
<body>

<div class="stage">
  <div class="scene" id="scene">
    <div class="wall"></div>

    <div class="safe-glow"></div>

    <div class="memory-cards">
      <div class="card c1">Mom</div>
      <div class="card c2">Dad</div>
      <div class="card c3">1998</div>
      <div class="card c4">Pets</div>
      <div class="card c5">Home</div>
    </div>

    <div class="door-wrap">
      <div class="door">
        <div class="vault">
          <div class="inner-ring"></div>

          <div class="wheel">
            <div class="spoke s1"></div>
            <div class="spoke s2"></div>
            <div class="spoke s3"></div>
            <div class="spoke s4"></div>
            <div class="spoke s5"></div>
            <div class="spoke s6"></div>
            <div class="hub"></div>
          </div>
        </div>

        <div class="bolt top"></div>
        <div class="bolt bottom"></div>
        <div class="label">Memory Vault</div>
      </div>
    </div>
  </div>

  <button id="vaultButton">Open Memory Vault</button>
  <div class="status" id="status">Protected until opened</div>
</div>

<script>
const scene = document.getElementById("scene");
const button = document.getElementById("vaultButton");
const statusText = document.getElementById("status");

let open = false;

function vaultSound(opening) {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;

  const ctx = new AudioContext();
  const now = ctx.currentTime;

  function tone(freq, start, length, gainValue) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.frequency.setValueAtTime(freq, now + start);
    osc.type = "sine";

    gain.gain.setValueAtTime(0, now + start);
    gain.gain.linearRampToValueAtTime(gainValue, now + start + .015);
    gain.gain.exponentialRampToValueAtTime(.001, now + start + length);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now + start);
    osc.stop(now + start + length + .04);
  }

  if (opening) {
    tone(170, 0, .16, .08);
    tone(120, .22, .20, .09);
    tone(80, .52, .36, .12);
  } else {
    tone(95, 0, .20, .09);
    tone(150, .28, .16, .08);
    tone(210, .48, .12, .06);
  }

  setTimeout(() => ctx.close(), 1300);
}

button.addEventListener("click", () => {
  open = !open;

  scene.classList.toggle("open", open);
  vaultSound(open);

  if (open) {
    button.textContent = "Close Memory Vault";
    statusText.textContent = "Welcome home";
  } else {
    button.textContent = "Open Memory Vault";
    statusText.textContent = "Protected until opened";
  }
});
</script>

</body>
</html>
